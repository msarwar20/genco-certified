admittance_perturbation:
  sigma: 0.2
  type: random_perturbation
generation_perturbation:
  sigma: 1.0
  type: cost_permutation
load:
  agg_profile: default
  change_reactive_power: true
  generator: agg_load_profile
  global_range: 0.4
  max_scaling_factor: 4.0
  scenarios: 30
  sigma: 0.2
  start_scaling_factor: 1.0
  step_size: 0.1
network:
  name: case118_ieee
  network_dir: scripts/grids
  source: pglib
settings:
  data_dir: data/exhaustive/n1
  dcpf_fast: true
  enable_solver_logs: false
  include_dc_res: true
  large_chunk_size: 1000
  max_iter: 100
  mode: pf
  num_processes: 6
  overwrite: true
  pf_fast: true
  seed: 3201
topology_perturbation:
  # n_minus_k enumerates ALL single-branch outages (plus the N-0 base topology) per load
  # scenario; `elements` is ignored by NMinusKGenerator (branches only, no generators),
  # and infeasible (islanding) outages are skipped.
  elements:
  - branch
  - gen
  k: 1
  type: n_minus_k
