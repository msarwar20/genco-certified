admittance_perturbation:
  sigma: 0.2
  type: random_perturbation
generation_perturbation:
  sigma: 1.0
  type: cost_permutation
load:
  agg_profile: default
  change_reactive_power: true
  generator: agg_load_profile
  global_range: 0.4
  max_scaling_factor: 4.0
  scenarios: 30
  sigma: 0.2
  start_scaling_factor: 1.0
  step_size: 0.1
network:
  name: case118_ieee
  network_dir: scripts/grids
  source: pglib
settings:
  data_dir: data/stress/n2
  dcpf_fast: true
  enable_solver_logs: false
  include_dc_res: true
  large_chunk_size: 1000
  max_iter: 100
  mode: pf
  num_processes: 6
  overwrite: true
  pf_fast: true
  seed: 2028
topology_perturbation:
  elements:
  - branch
  - gen
  k: 2
  n_topology_variants: 22
  type: random
  outage_count_probabilities:
  - 0.0
  - 0.0
  - 1.0
