[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genco-certified"
version = "0.1.0"
description = "Layer tracing, Newton certificates and certified contingency screening for the GENCO grid foundation model"
requires-python = ">=3.10,<3.13"
dependencies = ["gridfm-graphkit", "scipy", "pandas", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]
